name: Build ZTM alpha9 display-fit revision

on:
  push:
    paths:
      - '.github/workflows/build-ztm-alpha10-display-fit.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct published alpha9 final
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ztm-a9fit
          cat downloads/ZTM-Zero-to-Monero_0.1.8-alpha9-final_amd64.deb.b64.part* | base64 -d > /tmp/ztm-a9fit/baseline.deb
          echo '6aec29e14d1c33bc17a9350bf5990bf998c5be2ac12c708e3bf5989c4e834c3a  /tmp/ztm-a9fit/baseline.deb' | sha256sum -c -
          dpkg-deb -R /tmp/ztm-a9fit/baseline.deb /tmp/ztm-a9fit/pkg
          test "$(dpkg-deb -f /tmp/ztm-a9fit/baseline.deb Version)" = '0.1.8~alpha9final1'
          find /tmp/ztm-a9fit/pkg -type f ! -path '*/DEBIAN/control' ! -path '*/usr/lib/ztm/ztm_gui.py' -print0 | sort -z | xargs -0 sha256sum > /tmp/ztm-a9fit/non_gui_before.sha256

      - name: Apply surgical adaptive GUI scaling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          gui=Path('/tmp/ztm-a9fit/pkg/usr/lib/ztm/ztm_gui.py')
          s=gui.read_text(encoding='utf-8')
          old="""        self.root.geometry('1090x760')
        self.root.minsize(850, 650)
"""
          new="""        # Display-fit sizing: preserve the original 1090x760 design baseline,
        # but scale the GUI on larger/high-resolution displays.
        screen_w = self.root.winfo_screenwidth()
        screen_h = self.root.winfo_screenheight()
        usable_w = max(850, screen_w - 80)
        usable_h = max(650, screen_h - 100)
        target_w = min(1600, usable_w, max(1090, int(screen_w * 0.86)))
        target_h = min(950, usable_h, max(760, int(screen_h * 0.86)))
        pos_x = max(0, (screen_w - target_w) // 2)
        pos_y = max(0, (screen_h - target_h) // 2)
        self.root.geometry(f'{target_w}x{target_h}+{pos_x}+{pos_y}')
        self.root.minsize(min(1000, usable_w), min(700, usable_h))

        # Tk font sizes are point-based, so scaling Tk itself enlarges text and
        # standard widgets together without changing benchmark/application logic.
        size_ratio = min(target_w / 1090.0, target_h / 760.0)
        ui_scale = max(1.0, min(1.30, size_ratio))
        try:
            current_tk_scale = float(self.root.tk.call('tk', 'scaling'))
            self.root.tk.call('tk', 'scaling', current_tk_scale * ui_scale)
        except (tk.TclError, TypeError, ValueError):
            pass
"""
          if s.count(old) != 1:
              raise SystemExit('SECURITY STOP: expected GUI geometry block not found exactly once')
          gui.write_text(s.replace(old,new),encoding='utf-8')

          control=Path('/tmp/ztm-a9fit/pkg/DEBIAN/control')
          c=control.read_text(encoding='utf-8')
          if c.count('0.1.8~alpha9final1') != 1:
              raise SystemExit('SECURITY STOP: unexpected package version')
          control.write_text(c.replace('0.1.8~alpha9final1','0.1.8~alpha10display1'),encoding='utf-8')
          PY

          python3 -m py_compile /tmp/ztm-a9fit/pkg/usr/lib/ztm/ztm_gui.py
          find /tmp/ztm-a9fit/pkg/usr/lib/ztm -type d -name __pycache__ -prune -exec rm -rf '{}' +

          # Prove every packaged file except GUI source and package control is unchanged.
          find /tmp/ztm-a9fit/pkg -type f ! -path '*/DEBIAN/control' ! -path '*/usr/lib/ztm/ztm_gui.py' -print0 | sort -z | xargs -0 sha256sum > /tmp/ztm-a9fit/non_gui_after.sha256
          cmp /tmp/ztm-a9fit/non_gui_before.sha256 /tmp/ztm-a9fit/non_gui_after.sha256

          grep -F "ZTM-R-A-10-E-R" /tmp/ztm-a9fit/pkg/usr/lib/ztm/ztm_engine.py
          grep -F "target_w = min(1600" /tmp/ztm-a9fit/pkg/usr/lib/ztm/ztm_gui.py
          grep -F "ui_scale = max(1.0, min(1.30" /tmp/ztm-a9fit/pkg/usr/lib/ztm/ztm_gui.py

      - name: Build and verify package
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/ztm-a9fit/ZTM-Zero-to-Monero_0.1.9-alpha10-display_amd64.deb
          dpkg-deb --build --root-owner-group /tmp/ztm-a9fit/pkg "$OUT"
          test "$(dpkg-deb -f "$OUT" Package)" = 'ztm-zero-to-monero'
          test "$(dpkg-deb -f "$OUT" Architecture)" = 'amd64'
          test "$(dpkg-deb -f "$OUT" Version)" = '0.1.8~alpha10display1'
          rm -rf /tmp/ztm-a9fit/verify
          mkdir /tmp/ztm-a9fit/verify
          dpkg-deb -x "$OUT" /tmp/ztm-a9fit/verify
          grep -F "ZTM-R-A-10-E-R" /tmp/ztm-a9fit/verify/usr/lib/ztm/ztm_engine.py
          grep -F "screen_w = self.root.winfo_screenwidth()" /tmp/ztm-a9fit/verify/usr/lib/ztm/ztm_gui.py
          grep -F "current_tk_scale * ui_scale" /tmp/ztm-a9fit/verify/usr/lib/ztm/ztm_gui.py
          test -f /tmp/ztm-a9fit/verify/usr/share/icons/hicolor/64x64/apps/ztm.png
          sha256sum "$OUT" | tee /tmp/ztm-a9fit/package.sha256

      - name: Stage release and installer
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/ztm-a9fit/ZTM-Zero-to-Monero_0.1.9-alpha10-display_amd64.deb
          BASE=downloads/ZTM-Zero-to-Monero_0.1.9-alpha10-display_amd64.deb.b64
          rm -f "${BASE}.part"* || true
          base64 -w0 "$OUT" | split -b 6000 -d -a 2 - "${BASE}.part"
          PKG_SHA=$(sha256sum "$OUT" | awk '{print $1}')
          PKG_SIZE=$(stat -c %s "$OUT")
          cat > install-ztm-v9-display.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          export LC_ALL=C
          umask 077
          REPO='I2PS-Engineering/ZTM_Benchmark'
          PREFIX='downloads/ZTM-Zero-to-Monero_0.1.9-alpha10-display_amd64.deb.b64.part'
          EXPECTED_SHA='__PKG_SHA__'
          EXPECTED_SIZE='__PKG_SIZE__'
          DPKG_VERSION='0.1.8~alpha10display1'
          RAW="https://raw.githubusercontent.com/$REPO/main"
          [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]] || { echo 'ZTM α10 requires Ubuntu Linux x86-64.' >&2; exit 1; }
          [[ "${EUID:-0}" -ne 0 ]] || { echo 'Run as your normal Ubuntu desktop user, not root.' >&2; exit 1; }
          work="$(mktemp -d "${TMPDIR:-/tmp}/ztm-alpha9-fit.XXXXXXXX")"
          trap 'rm -rf "$work"' EXIT
          python3 - "$RAW" "$PREFIX" "$work/package.b64" <<'PY'
          import pathlib,sys,urllib.error,urllib.request
          raw,prefix,target=sys.argv[1:]
          parts=[]
          for i in range(100):
              url=f"{raw}/{prefix}{i:02d}"
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ZTM-Alpha10-Display/1.0'}),timeout=45) as r:
                      data=r.read(7001)
              except urllib.error.HTTPError as e:
                  if e.code==404 and i>0: break
                  raise
              if not data or len(data)>7000: raise SystemExit('SECURITY STOP: invalid package fragment')
              parts.append(data.decode('ascii'))
          if not parts: raise SystemExit('SECURITY STOP: package fragments unavailable')
          pathlib.Path(target).write_text(''.join(parts),encoding='ascii')
          PY
          base64 -d "$work/package.b64" > "$work/ztm.deb"
          test "$(stat -c %s "$work/ztm.deb")" = "$EXPECTED_SIZE"
          printf '%s  %s\n' "$EXPECTED_SHA" "$work/ztm.deb" | sha256sum -c -
          test "$(dpkg-deb -f "$work/ztm.deb" Package)" = 'ztm-zero-to-monero'
          test "$(dpkg-deb -f "$work/ztm.deb" Architecture)" = 'amd64'
          test "$(dpkg-deb -f "$work/ztm.deb" Version)" = "$DPKG_VERSION"
          if pgrep -a -x xmrig >/dev/null 2>&1; then
            echo 'An XMRig process is already running. Stop it before upgrading ZTM.' >&2
            pgrep -a -x xmrig >&2 || true
            exit 1
          fi
          sudo apt-get install -y "$work/ztm.deb"
          echo 'ZTM α10 display-fit revision installed. Launching...'
          nohup /usr/bin/ztm >/tmp/ztm-launch.log 2>&1 &
          SH
          sed -i "s/__PKG_SHA__/$PKG_SHA/;s/__PKG_SIZE__/$PKG_SIZE/" install-ztm-v9-display.sh
          chmod +x install-ztm-v9-display.sh
          cat > docs/ZTM_ALPHA10_DISPLAY_FIT.md <<EOF
          # ZTM α10 display-fit revision

          Package version: `0.1.8~alpha10display1`

          GUI-only correction over α9 final1:
          - replaces fixed `1090x760` startup geometry with adaptive, centered sizing;
          - scales Tk text/widgets proportionally on larger displays, capped at 1.30×;
          - keeps a safe minimum size on lower-resolution displays.

          Every packaged file other than `ztm_gui.py` and Debian `control` was hash-compared before/after and remained unchanged.

          Benchmark rig ID remains exactly `ZTM-R-A-10-E-R`.
          Package SHA-256: `$PKG_SHA`
          Package bytes: `$PKG_SIZE`
          EOF

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'I2PS Engineering Build'
          git config user.email 'engineering@i2psolutions.com'
          git add downloads/ZTM-Zero-to-Monero_0.1.9-alpha10-display_amd64.deb.b64.part* install-ztm-v9-display.sh docs/ZTM_ALPHA10_DISPLAY_FIT.md
          git commit -m 'release: ZTM α10 adaptive GUI scaling revision' || exit 0
          git push origin HEAD:main
