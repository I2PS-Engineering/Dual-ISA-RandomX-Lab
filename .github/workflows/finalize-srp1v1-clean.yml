name: Finalize ZTM-SRP1V1 Clean Surface

on:
  push:
    paths:
      - '.github/workflows/finalize-srp1v1-clean.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move stable tag to cleaned tree
        run: |
          set -euo pipefail
          git config user.name 'I2PS Engineering'
          git config user.email 'engineering@i2psolutions.com'
          git tag -f -a ZTM-SRP1V1 -m 'ZTM-SRP1V1 — Stable Release V1.1' HEAD
          git push --force origin refs/tags/ZTM-SRP1V1

      - name: Update repository About metadata
        id: about
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GITHUB_REPOSITORY" \
            -f description='ZTM — Zero to Monero. Stable Ubuntu x86-64 RandomX benchmark with a fixed 24-hour real-pool test.' \
            -f homepage='https://www.i2psolutions.com'
          printf '%s' '{"names":["ztm","zero-to-monero","randomx","monero","cpu-benchmark","xmrig","ubuntu","x86-64","i2ps-engineering"]}' | \
            gh api --method PUT "repos/$GITHUB_REPOSITORY/topics" --input -
