name: Validate ZTM-SRP1V2 Linux GUI

on:
  push:
    paths:
      - '.github/workflows/validate-ztm-srp1v2.yml'
      - 'release/autoscale_srp1v2.py'
      - 'release/patch_srp1v2.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V1.1 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ztm-v2
          gh release download ZTM-SRP1V1 -R I2PS-Engineering/ZTM_Benchmark -p ZTM-SRP1V1_amd64.deb -D /tmp/ztm-v2
          echo 'acd4bee9a502e39a673cbf39679710553fd83720cc261f5915166e8eb1c6dd56  /tmp/ztm-v2/ZTM-SRP1V1_amd64.deb' | sha256sum -c -
          dpkg-deb -R /tmp/ztm-v2/ZTM-SRP1V1_amd64.deb /tmp/ztm-v2/pkg
      - name: Apply controlled patch and verify invariants
        run: |
          set -euo pipefail
          ROOT=/tmp/ztm-v2/pkg
          find "$ROOT" -type f ! -path '*/DEBIAN/control' ! -path '*/usr/lib/ztm/ztm_gui.py' ! -path '*/usr/lib/ztm/ztm_engine.py' ! -path '*/usr/lib/ztm/ztm_mining.py' -print0 | sort -z | xargs -0 sha256sum > /tmp/ztm-v2/before
          python3 release/patch_srp1v2.py "$ROOT"
          python3 -m compileall -q "$ROOT/usr/lib/ztm"
          find "$ROOT/usr/lib/ztm" -type d -name __pycache__ -prune -exec rm -rf '{}' +
          find "$ROOT" -type f ! -path '*/DEBIAN/control' ! -path '*/usr/lib/ztm/ztm_gui.py' ! -path '*/usr/lib/ztm/ztm_engine.py' ! -path '*/usr/lib/ztm/ztm_mining.py' -print0 | sort -z | xargs -0 sha256sum > /tmp/ztm-v2/after
          cmp /tmp/ztm-v2/before /tmp/ztm-v2/after
          ENGINE="$ROOT/usr/lib/ztm/ztm_engine.py"
          python3 "$ENGINE" --plan --minutes 1440 >/tmp/ztm-v2/plan24
          if python3 "$ENGINE" --plan --minutes 60 >/tmp/ztm-v2/plan60 2>&1; then echo 'FAIL: 60-minute plan accepted'; exit 1; fi
          test "$(grep -Fo ZTM-SRP1V2 "$ENGINE" | wc -l)" -ge 4
          test "$(grep -Fo ZTM-SRP1V2 "$ROOT/usr/lib/ztm/ztm_mining.py" | wc -l)" -eq 2
          grep -Fq "WINNING CONFIGURATION" "$ENGINE"
          grep -Fq "show_winning_configuration" "$ROOT/usr/lib/ztm/ztm_gui.py"
          dpkg-deb --build --root-owner-group "$ROOT" /tmp/ztm-v2/ZTM-SRP1V2_amd64.deb
          test "$(dpkg-deb -f /tmp/ztm-v2/ZTM-SRP1V2_amd64.deb Version)" = '1.2.0~srp1v2'
          sha256sum /tmp/ztm-v2/ZTM-SRP1V2_amd64.deb
      - name: GUI auto-scaling smoke tests
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y xvfb python3-tk
          for resolution in 1024x768 1280x720 1366x768 1920x1080; do
            RES="$resolution" xvfb-run -a -s "-screen 0 ${resolution}x24" /usr/bin/python3 - <<'PY'
          import os, sys, tkinter as tk
          sys.path.insert(0, '/tmp/ztm-v2/pkg/usr/lib/ztm')
          import ztm_gui
          root=tk.Tk()
          app=ztm_gui.ZTMApp(root)
          root.update_idletasks()
          sw,sh=root.winfo_screenwidth(),root.winfo_screenheight()
          assert root.winfo_width() <= sw and root.winfo_height() <= sh
          expected=0.95 if sh<=800 else (1.10 if sh<=950 else (1.30 if sh<=1100 else 1.65))
          assert app._font_zoom == expected, (sw,sh,app._font_zoom)
          for control in (app.prepare_btn,app.benchmark_btn,app.terminal):
              assert control.winfo_ismapped(), (sw,sh,control)
              assert control.winfo_rootx()+control.winfo_width() <= root.winfo_rootx()+root.winfo_width()
              assert control.winfo_rooty()+control.winfo_height() <= root.winfo_rooty()+root.winfo_height()
          assert app.ui_zoom_status.get() == f"UI {round(expected*100)}%"
          app.change_zoom(0.15)
          assert app._font_zoom > expected
          app.change_zoom(-0.15)
          assert app._font_zoom == expected
          assert root.title().startswith("ZTM-SRP1V2")
          root.destroy()
          print("AUTO-SCALING PASS",sw,sh)
          PY
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ZTM-SRP1V2-verified-deb
          path: /tmp/ztm-v2/ZTM-SRP1V2_amd64.deb
