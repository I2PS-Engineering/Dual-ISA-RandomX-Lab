name: Refresh ZTM-SRP1V1 Release Notes

on:
  push:
    paths:
      - '.github/workflows/refresh-srp1v1-release.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update stable release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit ZTM-SRP1V1 \
            --title 'ZTM-SRP1V1 — Stable Release V1.1' \
            --notes-file docs/ZTM_SRP1V1_RELEASE_NOTES.md \
            --latest
