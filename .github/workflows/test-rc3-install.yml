name: RC3 published one-command installation acceptance
on:
  push:
    branches: [release/ztm-srp1v2-rc3]
    paths: ['.github/workflows/test-rc3-install.yml']
permissions:
  contents: read
jobs:
  clean-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact published installation command
        run: |
          set -euo pipefail
          curl -fLSs --retry 4 -o /tmp/ztm-rc3-instructions.txt \
            https://raw.githubusercontent.com/I2PS-Engineering/ZTM_Benchmark/release/ztm-srp1v2-rc3/INSTALL_RC3.txt
          sed -n '/^python3 -c /p' /tmp/ztm-rc3-instructions.txt >/tmp/ztm-rc3-command.sh
          test "$(wc -l </tmp/ztm-rc3-command.sh)" = 1
          bash -n /tmp/ztm-rc3-command.sh
          grep -q '5508b8976206fa90e883d270efd42ab6c64b33d52a0a4cab14c89ef575c0c1c2' /tmp/ztm-rc3-command.sh
      - name: Execute user installation verbatim
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          bash /tmp/ztm-rc3-command.sh
          dpkg -s ztm-zero-to-monero | grep -q '^Version: 1.2.3~srp1v2rc3$'
          test -f /usr/lib/ztm/ztm_startup_preflight.py
          test -f /usr/lib/ztm/ztm_surgical_runtime.py
          python3 /usr/lib/ztm/ztm_engine.py --plan --minutes 1440 >/dev/null
          if python3 /usr/lib/ztm/ztm_engine.py --plan --minutes 60 >/dev/null 2>&1;then exit 1;fi
          echo 'PASS installed RC3 through published checksum-verified command'
      - name: Installed GUI and mandatory startup-preflight smoke
        run: |
          set -euo pipefail
          sudo apt-get install -qq -y python3-tk xvfb
          sudo env PKEXEC_UID="$(id -u)" /usr/bin/python3 /usr/lib/ztm/ztm_startup_preflight.py
          PYTHONPATH=/usr/lib/ztm xvfb-run -a -w 2 -s '-screen 0 1024x768x24' /usr/bin/python3 - <<'PY'
          import tkinter as tk
          from ztm_gui import ZTMApp
          root=tk.Tk();app=ZTMApp(root);root.update_idletasks()
          assert app.prepare_btn.winfo_ismapped()
          assert app.benchmark_btn.winfo_ismapped()
          assert not app.confirm_power.get() and not app.confirm_reward.get()
          assert 'Profile' in app.profile_live.get()
          root.destroy()
          print('PASS GUI controls and progress indicator')
          PY
