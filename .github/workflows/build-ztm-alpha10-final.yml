name: Build ZTM alpha10 final

on:
  push:
    paths:
      - '.github/workflows/build-ztm-alpha10-final.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct alpha9 final baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ztm-a10
          cat downloads/ZTM-Zero-to-Monero_0.1.8-alpha9-final_amd64.deb.b64.part* | base64 -d > /tmp/ztm-a10/baseline.deb
          echo '6aec29e14d1c33bc17a9350bf5990bf998c5be2ac12c708e3bf5989c4e834c3a  /tmp/ztm-a10/baseline.deb' | sha256sum -c -
          test "$(dpkg-deb -f /tmp/ztm-a10/baseline.deb Package)" = "ztm-zero-to-monero"
          test "$(dpkg-deb -f /tmp/ztm-a10/baseline.deb Architecture)" = "amd64"
          test "$(dpkg-deb -f /tmp/ztm-a10/baseline.deb Version)" = "0.1.8~alpha9final1"
          dpkg-deb -R /tmp/ztm-a10/baseline.deb /tmp/ztm-a10/pkg

      - name: Apply surgical alpha10 changes
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/ztm-a10/pkg/usr/lib/ztm/ztm_engine.py /tmp/ztm-a10/ztm_engine.before.py

          python3 - <<'PY'
          from pathlib import Path

          root = Path('/tmp/ztm-a10/pkg')

          gui = root / 'usr/lib/ztm/ztm_gui.py'
          s = gui.read_text(encoding='utf-8')
          old = """        self.root.geometry('1090x760')
        self.root.minsize(850, 650)
"""
          new = """        # Adaptive display sizing for compact high-resolution laptop panels.
        screen_w = self.root.winfo_screenwidth()
        screen_h = self.root.winfo_screenheight()
        usable_w = max(850, screen_w - 80)
        usable_h = max(650, screen_h - 100)
        target_w = min(1600, usable_w, max(1090, int(screen_w * 0.86)))
        target_h = min(950, usable_h, max(760, int(screen_h * 0.86)))
        pos_x = max(0, (screen_w - target_w) // 2)
        pos_y = max(0, (screen_h - target_h) // 2)
        self.root.geometry(f'{target_w}x{target_h}+{pos_x}+{pos_y}')
        self.root.minsize(min(1000, usable_w), min(700, usable_h))

        size_ratio = min(target_w / 1090.0, target_h / 760.0)
        ui_scale = max(1.0, min(1.30, size_ratio))
        try:
            current_tk_scale = float(self.root.tk.call('tk', 'scaling'))
            self.root.tk.call('tk', 'scaling', current_tk_scale * ui_scale)
        except (tk.TclError, TypeError, ValueError):
            pass
"""
          if s.count(old) != 1:
              raise SystemExit('SECURITY STOP: alpha9 geometry block not found exactly once')
          gui.write_text(s.replace(old, new), encoding='utf-8')

          engine = root / 'usr/lib/ztm/ztm_engine.py'
          e = engine.read_text(encoding='utf-8')
          if e.count('ZTM-α9') != 1:
              raise SystemExit('SECURITY STOP: alpha9 rig ID not found exactly once')
          engine.write_text(e.replace('ZTM-α9', 'ZTM-R-A-10-E-R'), encoding='utf-8')

          control = root / 'DEBIAN/control'
          c = control.read_text(encoding='utf-8')
          if c.count('0.1.8~alpha9final1') != 1:
              raise SystemExit('SECURITY STOP: unexpected alpha9 baseline version')
          control.write_text(c.replace('0.1.8~alpha9final1', '0.1.9~alpha10final1'), encoding='utf-8')
          PY

          python3 -m compileall -q /tmp/ztm-a10/pkg/usr/lib/ztm
          find /tmp/ztm-a10/pkg/usr/lib/ztm -type d -name __pycache__ -prune -exec rm -rf '{}' +

          python3 - <<'PY'
          from pathlib import Path
          before = Path('/tmp/ztm-a10/ztm_engine.before.py').read_text(encoding='utf-8')
          after = Path('/tmp/ztm-a10/pkg/usr/lib/ztm/ztm_engine.py').read_text(encoding='utf-8')
          assert after.count('ZTM-R-A-10-E-R') == 1
          assert after.replace('ZTM-R-A-10-E-R', 'ZTM-α9') == before
          print('Rig-ID diff verified.')
          PY

          grep -F "screen_w = self.root.winfo_screenwidth()" /tmp/ztm-a10/pkg/usr/lib/ztm/ztm_gui.py
          grep -F "ui_scale = max(1.0, min(1.30" /tmp/ztm-a10/pkg/usr/lib/ztm/ztm_gui.py
          grep -F "ZTM-R-A-10-E-R" /tmp/ztm-a10/pkg/usr/lib/ztm/ztm_engine.py
          ! grep -RFn --include='*.py' 'ZTM-α9' /tmp/ztm-a10/pkg/usr/lib/ztm

      - name: Build and verify alpha10 package
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/ztm-a10/ZTM-Zero-to-Monero_0.1.9-alpha10-final_amd64.deb
          dpkg-deb --build --root-owner-group /tmp/ztm-a10/pkg "$OUT"
          test "$(dpkg-deb -f "$OUT" Package)" = "ztm-zero-to-monero"
          test "$(dpkg-deb -f "$OUT" Architecture)" = "amd64"
          test "$(dpkg-deb -f "$OUT" Version)" = "0.1.9~alpha10final1"
          rm -rf /tmp/ztm-a10/verify && mkdir /tmp/ztm-a10/verify
          dpkg-deb -x "$OUT" /tmp/ztm-a10/verify
          grep -F "ZTM-R-A-10-E-R" /tmp/ztm-a10/verify/usr/lib/ztm/ztm_engine.py
          grep -F "screen_w = self.root.winfo_screenwidth()" /tmp/ztm-a10/verify/usr/lib/ztm/ztm_gui.py
          grep -F "current_tk_scale * ui_scale" /tmp/ztm-a10/verify/usr/lib/ztm/ztm_gui.py
          test -x /tmp/ztm-a10/verify/usr/bin/ztm
          test -f /tmp/ztm-a10/verify/usr/share/applications/ztm.desktop
          test -f /tmp/ztm-a10/verify/usr/share/icons/hicolor/64x64/apps/ztm.png
          sha256sum "$OUT" | tee /tmp/ztm-a10/package.sha256

      - name: Stage alpha10 package and installer
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/ztm-a10/ZTM-Zero-to-Monero_0.1.9-alpha10-final_amd64.deb
          BASE=downloads/ZTM-Zero-to-Monero_0.1.9-alpha10-final_amd64.deb.b64
          rm -f "${BASE}.part"* || true
          base64 -w0 "$OUT" | split -b 6000 -d -a 2 - "${BASE}.part"
          PKG_SHA=$(sha256sum "$OUT" | awk '{print $1}')
          PKG_SIZE=$(stat -c %s "$OUT")

          cat > install-ztm-v10.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          export LC_ALL=C
          umask 077
          REPO='I2PS-Engineering/ZTM_Benchmark'
          PREFIX='downloads/ZTM-Zero-to-Monero_0.1.9-alpha10-final_amd64.deb.b64.part'
          EXPECTED_SHA='__PKG_SHA__'
          EXPECTED_SIZE='__PKG_SIZE__'
          DPKG_VERSION='0.1.9~alpha10final1'
          RAW="https://raw.githubusercontent.com/$REPO/main"

          [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]] || { echo 'ZTM α10 requires Ubuntu Linux x86-64.' >&2; exit 1; }
          [[ "${EUID:-0}" -ne 0 ]] || { echo 'Run this command as your normal Ubuntu desktop user, not root.' >&2; exit 1; }

          work="$(mktemp -d "${TMPDIR:-/tmp}/ztm-alpha10.XXXXXXXX")"
          trap 'rm -rf "$work"' EXIT

          python3 - "$RAW" "$PREFIX" "$work/package.b64" <<'PY'
          import pathlib, sys, urllib.error, urllib.request
          raw, prefix, target = sys.argv[1:]
          parts = []
          for i in range(100):
              url = f"{raw}/{prefix}{i:02d}"
              req = urllib.request.Request(url, headers={'User-Agent':'ZTM-Alpha10-Installer/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      data = response.read(7001)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404 and i > 0:
                      break
                  raise
              if not data or len(data) > 7000:
                  raise SystemExit('SECURITY STOP: invalid package fragment')
              parts.append(data.decode('ascii'))
          if not parts:
              raise SystemExit('SECURITY STOP: package fragments unavailable')
          pathlib.Path(target).write_text(''.join(parts), encoding='ascii')
          PY

          base64 -d "$work/package.b64" > "$work/ztm.deb"
          test "$(stat -c %s "$work/ztm.deb")" = "$EXPECTED_SIZE"
          printf '%s  %s\n' "$EXPECTED_SHA" "$work/ztm.deb" | sha256sum -c -
          test "$(dpkg-deb -f "$work/ztm.deb" Package)" = 'ztm-zero-to-monero'
          test "$(dpkg-deb -f "$work/ztm.deb" Architecture)" = 'amd64'
          test "$(dpkg-deb -f "$work/ztm.deb" Version)" = "$DPKG_VERSION"

          if pgrep -a -x xmrig >/dev/null 2>&1; then
            echo 'An XMRig process is already running. Stop it before upgrading ZTM.' >&2
            pgrep -a -x xmrig >&2 || true
            exit 1
          fi

          sudo apt-get install -y "$work/ztm.deb"
          echo 'ZTM α10 installed. Launching...'
          nohup /usr/bin/ztm >/tmp/ztm-launch.log 2>&1 &
          SH

          sed -i "s/__PKG_SHA__/$PKG_SHA/;s/__PKG_SIZE__/$PKG_SIZE/" install-ztm-v10.sh
          chmod +x install-ztm-v10.sh

          cat > docs/ZTM_ALPHA10_FINAL.md <<EOF
          # ZTM α10 final

          Package version: `0.1.9~alpha10final1`

          Changes from α9 final:
          - Rig ID: `ZTM-R-A-10-E-R`
          - Adaptive centered GUI sizing instead of fixed 1090x760.
          - Proportional Tk UI scaling up to 1.30× on larger displays.
          - Official ZTM 0–10K H/s icon retained.

          Benchmark, optimizer, Wallet, Mining, 24-hour gate, one-auth session,
          donation behavior, and shutdown guardian remain unchanged.

          Package SHA-256: `$PKG_SHA`
          Package bytes: `$PKG_SIZE`
          EOF

      - name: Publish alpha10 final
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'I2PS Engineering Build'
          git config user.email 'engineering@i2psolutions.com'
          git add downloads/ZTM-Zero-to-Monero_0.1.9-alpha10-final_amd64.deb.b64.part* install-ztm-v10.sh docs/ZTM_ALPHA10_FINAL.md
          git commit -m 'release: ZTM alpha10 adaptive GUI and rig ID' || exit 0
          git push origin HEAD:main
