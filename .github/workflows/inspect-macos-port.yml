name: Inspect ZTM macOS portability

on:
  push:
    paths:
      - '.github/workflows/inspect-macos-port.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download stable release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ztm-port/pkg
          gh release download ZTM-SRP1V1 -R I2PS-Engineering/ZTM_Benchmark -p 'ZTM-SRP1V1_amd64.deb' -D /tmp/ztm-port
          echo 'acd4bee9a502e39a673cbf39679710553fd83720cc261f5915166e8eb1c6dd56  /tmp/ztm-port/ZTM-SRP1V1_amd64.deb' | sha256sum -c -
          dpkg-deb -x /tmp/ztm-port/ZTM-SRP1V1_amd64.deb /tmp/ztm-port/pkg
      - name: Inspect code and dependency assumptions
        run: |
          set -euo pipefail
          cd /tmp/ztm-port/pkg
          echo '=== Installed file tree ==='
          find . -type f -printf '%p (%s bytes)\\n' | sort
          echo '=== Python imports and critical identifiers ==='
          grep -nE '^import |^from |^def |^class |^if __name__|^BENCHMARK_|^DONAT|^XMRIG_|^APP_|^RESULT|^def main' usr/lib/ztm/*.py | head -240 || true
          echo '=== Linux-specific references ==='
          grep -nEi 'pkexec|systemctl|apt-get|apt |dpkg|udevadm|/proc/|/sys/|/run/|/usr/|/etc/|linux|os.geteuid|sudo|setsid|SIGKILL|killpg|msr|huge.pages|taskset|polkit|\.deb|desktop|xdg|gnome|tkinter|authorization' usr/lib/ztm/*.py | head -380 || true
          echo '=== Main GUI 1-240 ==='
          nl -ba usr/lib/ztm/ztm_gui.py | sed -n '1,240p'
          echo '=== GUI benchmark 460-720 ==='
          nl -ba usr/lib/ztm/ztm_gui.py | sed -n '460,720p'
          echo '=== Engine 1-230 ==='
          nl -ba usr/lib/ztm/ztm_engine.py | sed -n '1,230p'
          echo '=== ENGINE MAIN LOOP 240-565 ==='
          nl -ba usr/lib/ztm/ztm_engine.py | sed -n '240,565p'
          echo '=== MINING COMPLETE ==='
          nl -ba usr/lib/ztm/ztm_mining.py | sed -n '1,170p'
          echo '=== GUI 75-460 ==='
          nl -ba usr/lib/ztm/ztm_gui.py | sed -n '75,460p'
