name: Build ZTM alpha9 final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct alpha9 desktop baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ztm-a9
          cat downloads/ZTM-Zero-to-Monero_0.1.8-alpha9-desktop_amd64.deb.b64.part* | base64 -d > /tmp/ztm-a9/baseline.deb
          test "$(dpkg-deb -f /tmp/ztm-a9/baseline.deb Package)" = "ztm-zero-to-monero"
          test "$(dpkg-deb -f /tmp/ztm-a9/baseline.deb Architecture)" = "amd64"
          test "$(dpkg-deb -f /tmp/ztm-a9/baseline.deb Version)" = "0.1.8~alpha9desktop1"
          dpkg-deb -R /tmp/ztm-a9/baseline.deb /tmp/ztm-a9/pkg
          echo 'Current rig IDs:'
          grep -RInE 'ZTM-(Zero-to-Monero|Personal-Mining|I2PS-Donate)' /tmp/ztm-a9/pkg/usr/lib/ztm || true

      - name: Apply surgical alpha9 final changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/ztm-a9/pkg')
          old='ZTM-Zero-to-Monero'
          new='ZTM-α9'
          changed=[]
          count=0
          for p in (root/'usr/lib/ztm').glob('*.py'):
              s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n:
                  p.write_text(s.replace(old,new),encoding='utf-8')
                  count += n
                  changed.append(str(p.relative_to(root)))
          if count < 1:
              raise SystemExit('SECURITY STOP: benchmark rig ID was not found')
          print('Rig-ID replacements:',count,changed)
          control=root/'DEBIAN/control'
          s=control.read_text()
          if '0.1.8~alpha9desktop1' not in s:
              raise SystemExit('SECURITY STOP: unexpected alpha9 package version')
          control.write_text(s.replace('0.1.8~alpha9desktop1','0.1.8~alpha9final1'))
          PY
          find /tmp/ztm-a9/pkg/usr/share/icons -type f -name 'ztm.png' -delete 2>/dev/null || true
          install -d -m 0755 /tmp/ztm-a9/pkg/usr/share/icons/hicolor/64x64/apps
          base64 -d assets/ZTM_alpha9_icon_64.png.b64 > /tmp/ztm-a9/pkg/usr/share/icons/hicolor/64x64/apps/ztm.png
          test "$(sha256sum /tmp/ztm-a9/pkg/usr/share/icons/hicolor/64x64/apps/ztm.png | awk '{print $1}')" = "24a2856c0f5831220e6c92c7e97aadad66c471f95396a9e1fcb1b93d7d47f529"
          python3 -m compileall -q /tmp/ztm-a9/pkg/usr/lib/ztm
          find /tmp/ztm-a9/pkg/usr/lib/ztm -type d -name __pycache__ -prune -exec rm -rf '{}' +

      - name: Build and verify alpha9 final package
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/ztm-a9/ZTM-Zero-to-Monero_0.1.8-alpha9-final_amd64.deb
          dpkg-deb --build --root-owner-group /tmp/ztm-a9/pkg "$OUT"
          test "$(dpkg-deb -f "$OUT" Package)" = "ztm-zero-to-monero"
          test "$(dpkg-deb -f "$OUT" Architecture)" = "amd64"
          test "$(dpkg-deb -f "$OUT" Version)" = "0.1.8~alpha9final1"
          rm -rf /tmp/ztm-a9/verify && mkdir /tmp/ztm-a9/verify
          dpkg-deb -x "$OUT" /tmp/ztm-a9/verify
          grep -RFn 'ZTM-α9' /tmp/ztm-a9/verify/usr/lib/ztm
          ! grep -RFn 'ZTM-Zero-to-Monero' /tmp/ztm-a9/verify/usr/lib/ztm/*.py
          test -x /tmp/ztm-a9/verify/usr/bin/ztm
          test -f /tmp/ztm-a9/verify/usr/share/applications/ztm.desktop
          test "$(sha256sum /tmp/ztm-a9/verify/usr/share/icons/hicolor/64x64/apps/ztm.png | awk '{print $1}')" = "24a2856c0f5831220e6c92c7e97aadad66c471f95396a9e1fcb1b93d7d47f529"
          sha256sum "$OUT" | tee /tmp/ztm-a9/package.sha256

      - name: Stage final package and installer
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/ztm-a9/ZTM-Zero-to-Monero_0.1.8-alpha9-final_amd64.deb
          BASE=downloads/ZTM-Zero-to-Monero_0.1.8-alpha9-final_amd64.deb.b64
          rm -f "${BASE}.part"* || true
          base64 -w0 "$OUT" | split -b 6000 -d -a 2 - "${BASE}.part"
          PKG_SHA=$(sha256sum "$OUT" | awk '{print $1}')
          PKG_SIZE=$(stat -c %s "$OUT")
          cat > install-ztm-v9.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          REPO='I2PS-Engineering/ZTM_Benchmark'
          PREFIX='downloads/ZTM-Zero-to-Monero_0.1.8-alpha9-final_amd64.deb.b64.part'
          EXPECTED_SHA='__PKG_SHA__'
          EXPECTED_SIZE='__PKG_SIZE__'
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          echo 'ZTM: downloading verified α9 final package from GitHub...'
          : > "$TMP/package.b64"
          for i in $(seq -w 0 99); do
            url="https://raw.githubusercontent.com/$REPO/main/${PREFIX}${i}"
            if curl -fsSL "$url" -o "$TMP/part"; then
              cat "$TMP/part" >> "$TMP/package.b64"
            else
              break
            fi
          done
          test -s "$TMP/package.b64" || { echo 'SECURITY STOP: package parts unavailable'; exit 1; }
          base64 -d "$TMP/package.b64" > "$TMP/ztm.deb"
          test "$(stat -c %s "$TMP/ztm.deb")" = "$EXPECTED_SIZE" || { echo 'SECURITY STOP: package size mismatch'; exit 1; }
          echo "$EXPECTED_SHA  $TMP/ztm.deb" | sha256sum -c -
          test "$(dpkg-deb -f "$TMP/ztm.deb" Package)" = 'ztm-zero-to-monero'
          test "$(dpkg-deb -f "$TMP/ztm.deb" Architecture)" = 'amd64'
          test "$(dpkg-deb -f "$TMP/ztm.deb" Version)" = '0.1.8~alpha9final1'
          sudo apt-get install -y "$TMP/ztm.deb"
          echo 'ZTM α9 final installed. Launching...'
          nohup /usr/bin/ztm >/tmp/ztm-launch.log 2>&1 &
          SH
          sed -i "s/__PKG_SHA__/$PKG_SHA/;s/__PKG_SIZE__/$PKG_SIZE/" install-ztm-v9.sh
          chmod +x install-ztm-v9.sh
          python3 - <<PY
          from pathlib import Path
          Path('docs/ZTM_ALPHA9_FINAL.md').write_text("""# ZTM α9 final

Final α9 integration release built from the tested one-authentication backend and desktop-launcher baseline.

Surgical changes only:
- Benchmark XMRig rig ID: `ZTM-α9`.
- Official ZTM 0–10K H/s performance-gauge desktop icon installed as the application icon.
- Desktop shortcut behavior retained.
- Benchmark optimizer, Wallet, Mining, donation logic, 24-hour gate, and privileged shutdown/session behavior unchanged.

Package SHA-256: `$PKG_SHA`
Package bytes: `$PKG_SIZE`
Debian version: `0.1.8~alpha9final1`
""", encoding='utf-8')
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZTM-alpha9-final
          path: |
            /tmp/ztm-a9/ZTM-Zero-to-Monero_0.1.8-alpha9-final_amd64.deb
            /tmp/ztm-a9/package.sha256
            install-ztm-v9.sh
            docs/ZTM_ALPHA9_FINAL.md

      - name: Publish alpha9 final to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'I2PS Engineering Build'
          git config user.email 'engineering@i2psolutions.com'
          git add downloads/ZTM-Zero-to-Monero_0.1.8-alpha9-final_amd64.deb.b64.part* install-ztm-v9.sh docs/ZTM_ALPHA9_FINAL.md
          git commit -m 'release: ZTM α9 final desktop icon and rig ID' || exit 0
          git push origin HEAD:main
