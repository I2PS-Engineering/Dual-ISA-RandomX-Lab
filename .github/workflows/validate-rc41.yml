name: Validate isolated ZTM V2 RC4.1 fixed-seven CPU affinity
on:
  push:
    branches: [release/ztm-srp1v2-rc4-1]
    paths:
      - 'release/patch_rc41.py'
      - 'release/ztm_affinity_profiles.py'
      - 'release/test_rc41_fixed_seven.py'
      - '.github/workflows/validate-rc41.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-seven:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian and GUI test prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
      - name: Download and hash-verify exact published RC4 baseline
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --output /tmp/rc4.deb https://github.com/I2PS-Engineering/ZTM_Benchmark/releases/download/ZTM-SRP1V2-RC4/ZTM-SRP1V2-RC4_amd64.deb
          echo 'abd42a5ded115966dc20d761560581f2c6009575f73f433869400183404aa879  /tmp/rc4.deb' | sha256sum -c -
          test "$(stat -c %s /tmp/rc4.deb)" = '121844'
          test "$(dpkg-deb -f /tmp/rc4.deb Version)" = '1.2.4~srp1v2rc4'
      - name: Patch RC4.1 affinity engine and build Debian
        run: |
          set -euo pipefail
          dpkg-deb -R /tmp/rc4.deb /tmp/rc41-root
          python3 release/patch_rc41.py /tmp/rc41-root
          python3 -m compileall -q /tmp/rc41-root/usr/lib/ztm
          test -f /tmp/rc41-root/usr/lib/ztm/ztm_startup_preflight.py
          dpkg-deb --build --root-owner-group /tmp/rc41-root /tmp/ZTM-SRP1V2-RC4.1_amd64.deb
          test "$(dpkg-deb -f /tmp/ZTM-SRP1V2-RC4.1_amd64.deb Version)" = '1.2.5~srp1v2rc41'
      - name: Test fixed seven profiles, physical topology and real XMRig config format
        run: |
          set -euo pipefail
          export PYTHONPATH=/tmp/rc41-root/usr/lib/ztm
          python3 -m unittest discover -s release -p 'test_rc41_fixed_seven.py' -v
          python3 - <<'PY'
          import ztm_engine as e
          from ztm_surgical_runtime import cpu_inventory
          from ztm_affinity_profiles import generate_affinity_profiles
          assert e._profile_limits(86400)==(7,900)
          assert e.TRANSITION_SECONDS==5
          inv=cpu_inventory()
          assert len(inv['allowed_cpu_ids'])>=3
          assert len(generate_affinity_profiles(inv,min(4,len(inv['allowed_cpu_ids']))))==6
          print('CI real Linux affinity topology:', inv['allowed_cpu_ids'][:12],len(inv['core_groups']))
          from pathlib import Path
          code=Path('/tmp/rc41-root/usr/lib/ztm/ztm_engine.py').read_text()
          assert 'set_xmrig_affinity_config(' in code
          assert "alternates=generate_affinity_profiles(" in code
          assert "total=7" in code
          assert "measurement['cpu_ids']=list(cpu_ids)" in code
          assert "winner_launch=({'cpu_ids':list(selected_affinity)}" in code
          assert "transition_to(winner_launch)" in code
          assert "verify_transition(stop_profile_guard,verify_no_miner)" in code
          PY
      - name: Verify existing consent controls and live Profile 1/7 through 7/7 at four screen sizes
        run: |
          set -euo pipefail
          export PYTHONPATH=/tmp/rc41-root/usr/lib/ztm
          for screen in 1024x768 1280x720 1366x768 1920x1080; do
            xvfb-run -a -s "-screen 0 ${screen}x24" python3 - <<'PY'
          import tkinter as tk
          from ztm_gui import ZTMApp
          root=tk.Tk()
          app=ZTMApp(root)
          root.update_idletasks()
          assert not app.confirm_power.get() and not app.confirm_reward.get()
          for index in range(1,8):
              app.append('[ZTM_PROFILE] {"index":%d,"total":7,"active":2,"init":4,"elapsed":65,"target":900}' % index)
              assert 'Profile %d/7' % index in app.profile_live.get()
              assert '01:05 / 15:00' in app.profile_live.get()
          root.destroy()
          PY
          done
      - name: Install RC4.1 package on Ubuntu CI runner
        run: |
          set -euo pipefail
          sudo apt-get install -y /tmp/ZTM-SRP1V2-RC4.1_amd64.deb
          dpkg -s ztm-zero-to-monero | grep -q '^Version: 1.2.5~srp1v2rc41$'
          python3 -m py_compile /usr/lib/ztm/ztm_affinity_profiles.py
          test -f /usr/lib/ztm/ztm_startup_preflight.py
          echo 'RC4.1 INSTALL AND FIXED SEVEN ACCEPTANCE PASS'
          sha256sum /tmp/ZTM-SRP1V2-RC4.1_amd64.deb
          stat -c '%s bytes' /tmp/ZTM-SRP1V2-RC4.1_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: ZTM-SRP1V2-RC4.1-VALIDATED-CANDIDATE
          path: /tmp/ZTM-SRP1V2-RC4.1_amd64.deb
