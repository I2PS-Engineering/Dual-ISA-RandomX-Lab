name: Build native macOS P1

on:
  push:
    branches: [feature/macos-native]
    paths:
      - 'macos/**'
      - '.github/workflows/build-macos-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify native platform
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = "${{ matrix.arch }}"
          python3 --version

      - name: Compile app and verify 24-hour lock
        run: |
          set -euo pipefail
          python3 -m compileall -q macos/ztm
          python3 macos/ztm/launcher.py --ztm-child engine --plan --minutes 1440 > /tmp/ztm-plan.txt
          grep -Fq '86400 s' /tmp/ztm-plan.txt
          if python3 macos/ztm/launcher.py --ztm-child engine --plan --minutes 60 >/tmp/ztm-invalid.txt 2>&1; then
            echo 'SECURITY STOP: engine accepted 60 minutes' >&2
            exit 1
          fi
          if python3 macos/ztm/launcher.py --ztm-child engine --plan --minutes 1440 --threads 2 >/tmp/ztm-threads.txt 2>&1; then
            echo 'SECURITY STOP: engine accepted manual threads' >&2
            exit 1
          fi
          PYTHONPATH=macos/ztm python3 -c 'import ztm_gui, ztm_engine, ztm_mining, ztm_native, ztm_wallet; print("Imports OK")'
          PYTHONPATH=macos/ztm python3 macos/ztm/test_winner.py
          PYTHONPATH=macos/ztm python3 - <<'PY'
          from ztm_gui import benchmark_session, os_is_supported
          from ztm_engine import BenchError
          from ztm_winner import build_winning_configuration
          assert os_is_supported()
          for m, t in [(60, None), (1440, 3)]:
              try:
                  benchmark_session('pool.hashvault.pro:443',
                      '4' + 'A' * 94, False, m, t)
              except BenchError:
                  pass
              else:
                  raise AssertionError('Bypassed macOS GUI stable restrictions')
          print('GUI benchmark lock OK')
          PY


      - name: Verify native official XMRig
        run: |
          set -euo pipefail
          python3 macos/ztm/launcher.py --ztm-child prepare
          XMRIG="$HOME/Library/Application Support/I2PS/ZTM/xmrig-6.26.0/xmrig"
          test -x "$XMRIG"
          "$XMRIG" --version
          file "$XMRIG"

      - name: Build self-contained macOS application
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade 'pyinstaller==6.16.0'
          mkdir -p /tmp/ztm.iconset
          for size in 16 32 128 256 512; do
            sips -s format png -z "$size" "$size" macos/assets/icon.png --out "/tmp/ztm.iconset/icon_${size}x${size}.png" >/dev/null
            doubled=$((size * 2))
            sips -s format png -z "$doubled" "$doubled" macos/assets/icon.png --out "/tmp/ztm.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns /tmp/ztm.iconset -o /tmp/ZTM.icns
          python3 -m PyInstaller --clean --noconfirm --windowed --onedir \
            --name ZTM --osx-bundle-identifier com.i2psolutions.ztm.macos.p1 \
            --paths macos/ztm --icon /tmp/ZTM.icns \
            --add-data 'macos/ztm/i2ps-logo.png:.' \
            --add-data 'macos/ztm/MINING_TERMS.md:.' \
            macos/ztm/launcher.py
          test -d dist/ZTM.app
          plutil -lint dist/ZTM.app/Contents/Info.plist
          codesign --verify --deep dist/ZTM.app

      - name: Check packaged child-mode 24-hour lock
        run: |
          set -euo pipefail
          APP=dist/ZTM.app/Contents/MacOS/ZTM
          "$APP" --ztm-child engine --plan --minutes 1440 > /tmp/ztm-bundled-plan.txt
          grep -Fq '86400 s' /tmp/ztm-bundled-plan.txt
          if "$APP" --ztm-child engine --plan --minutes 60 >/dev/null 2>&1; then
            echo 'SECURITY STOP: packaged engine accepted shorter duration' >&2
            exit 1
          fi

      - name: Package test artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          hdiutil create -volname "ZTM macOS P1" -srcfolder dist/ZTM.app -ov \
            -format UDZO "out/ZTM-macOS-P1-${{ matrix.arch }}.dmg"
          (cd dist && ditto -c -k --sequesterRsrc --keepParent ZTM.app "../out/ZTM-macOS-P1-${{ matrix.arch }}.zip")
          shasum -a 256 out/* > "out/SHA256SUMS-${{ matrix.arch }}.txt"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ZTM-macOS-P1-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    name: Publish macOS P1 preview
    runs-on: ubuntu-latest
    needs: macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ZTM-macOS-P1-*
          merge-multiple: true
          path: publish

      - name: Check preview artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          for arch in arm64 x86_64; do
            test -s "ZTM-macOS-P1-$arch.dmg"
            test -s "ZTM-macOS-P1-$arch.zip"
            test -s "SHA256SUMS-$arch.txt"
            shasum -a 256 -c "SHA256SUMS-$arch.txt"
          done

      - name: Publish separate macOS prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ztm-macos-release-notes.md <<'NOTES'
          # ZTM — Native macOS Preview P1

          First native macOS preview of I2PS Engineering Zero to Monero.

          **This is a prerelease for engineering testing, not the approved Linux Stable Release V1.1.**

          ## Available macOS builds

          - Apple Silicon: `ZTM-macOS-P1-arm64.dmg` and `ZTM-macOS-P1-arm64.zip`.
          - Intel Mac: `ZTM-macOS-P1-x86_64.dmg` and `ZTM-macOS-P1-x86_64.zip`.
          - Separate SHA-256 checksum files for both architectures.

          ## Features

          - Real RandomX using native official XMRig 6.26.0, pinned to upstream SHA-256 hashes.
          - **Fixed 24-hour online benchmark**, with CPU Threads: Auto.
          - Retains both benchmark-consent checkboxes.
          - Tested thread-profile optimization and pool accepted/rejected shares.
          - **Winning Configuration** result after the benchmark: selected active threads, search median/mean/peak, stability, optimizer score, sustained winner statistics, accepted/rejected shares, comparison of all tested profiles, and the highest instantaneous peak.
          - Full result JSON plus a separate, readable winning-configuration text file.
          - Qualification gate for Wallet and personal mining after a verified uninterrupted 24-hour run.
          - Public Monero receiving addresses only, no private wallet keys or recovery phrases.
          - Upstream XMRig plus I2PS developer contribution disclosed in the GUI.
          - Native user-level XMRig process guardian; no macOS administrator escalation.

          ## Testing status

          Native macOS arm64 and x86_64 continuous integration has compiled the code, verified pinned official XMRig downloads, verified the mandatory 24-hour benchmark constraint, built the native application bundles and tested the packaged child commands.

          **Pending:** on-device GUI interaction, full pool-connected 24-hour benchmark, thermal evaluation, and shutdown verification during actual mining on an Intel Mac and Apple Silicon Mac.

          These test builds are **not Developer ID signed or Apple notarized**. macOS Gatekeeper may request explicit user approval through System Settings > Privacy & Security.

          Do not confuse this engineering preview with the verified Ubuntu package `ZTM-SRP1V1`. The Linux stable release remains unchanged.
          NOTES

          gh release create ZTM-macOS-P1 \
            publish/ZTM-macOS-P1-arm64.dmg \
            publish/ZTM-macOS-P1-arm64.zip \
            publish/SHA256SUMS-arm64.txt \
            publish/ZTM-macOS-P1-x86_64.dmg \
            publish/ZTM-macOS-P1-x86_64.zip \
            publish/SHA256SUMS-x86_64.txt \
            --title 'ZTM macOS Preview P1 — Apple Silicon and Intel' \
            --notes-file /tmp/ztm-macos-release-notes.md \
            --target "$GITHUB_SHA" \
            --prerelease

      - name: Verify prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ZTM-macOS-P1 --json tagName,name,isPrerelease,url,assets
