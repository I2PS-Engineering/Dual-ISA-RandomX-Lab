name: Publish ZTM-SRP1V2 Linux GUI Release

on:
  push:
    paths:
      - '.github/workflows/publish-ztm-srp1v2.yml'
      - 'release/patch_srp1v2.py'
      - 'release/make_srp1v2_assets.py'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V1.1 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ztm-v2
          gh release download ZTM-SRP1V1 -R I2PS-Engineering/ZTM_Benchmark -p ZTM-SRP1V1_amd64.deb -D /tmp/ztm-v2
          echo 'acd4bee9a502e39a673cbf39679710553fd83720cc261f5915166e8eb1c6dd56  /tmp/ztm-v2/ZTM-SRP1V1_amd64.deb' | sha256sum -c -
          dpkg-deb -R /tmp/ztm-v2/ZTM-SRP1V1_amd64.deb /tmp/ztm-v2/pkg
      - name: Apply controlled patch and verify invariants
        run: |
          set -euo pipefail
          ROOT=/tmp/ztm-v2/pkg
          find "$ROOT" -type f ! -path '*/DEBIAN/control' ! -path '*/usr/lib/ztm/ztm_gui.py' ! -path '*/usr/lib/ztm/ztm_engine.py' ! -path '*/usr/lib/ztm/ztm_mining.py' -print0 | sort -z | xargs -0 sha256sum > /tmp/ztm-v2/before
          python3 release/patch_srp1v2.py "$ROOT"
          python3 -m compileall -q "$ROOT/usr/lib/ztm"
          find "$ROOT/usr/lib/ztm" -type d -name __pycache__ -prune -exec rm -rf '{}' +
          find "$ROOT" -type f ! -path '*/DEBIAN/control' ! -path '*/usr/lib/ztm/ztm_gui.py' ! -path '*/usr/lib/ztm/ztm_engine.py' ! -path '*/usr/lib/ztm/ztm_mining.py' -print0 | sort -z | xargs -0 sha256sum > /tmp/ztm-v2/after
          cmp /tmp/ztm-v2/before /tmp/ztm-v2/after
          ENGINE="$ROOT/usr/lib/ztm/ztm_engine.py"
          python3 "$ENGINE" --plan --minutes 1440 >/tmp/ztm-v2/plan24
          if python3 "$ENGINE" --plan --minutes 60 >/tmp/ztm-v2/plan60 2>&1; then echo 'FAIL: 60-minute plan accepted'; exit 1; fi
          test "$(grep -Fo ZTM-SRP1V2 "$ENGINE" | wc -l)" -ge 4
          test "$(grep -Fo ZTM-SRP1V2 "$ROOT/usr/lib/ztm/ztm_mining.py" | wc -l)" -eq 2
          grep -Fq "WINNING CONFIGURATION" "$ENGINE"
          grep -Fq "show_winning_configuration" "$ROOT/usr/lib/ztm/ztm_gui.py"
          dpkg-deb --build --root-owner-group "$ROOT" /tmp/ztm-v2/ZTM-SRP1V2_amd64.deb
          test "$(dpkg-deb -f /tmp/ztm-v2/ZTM-SRP1V2_amd64.deb Version)" = '1.2.0~srp1v2'
          sha256sum /tmp/ztm-v2/ZTM-SRP1V2_amd64.deb
      - name: GUI render and zoom smoke test at 1366x768
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y xvfb python3-tk
          xvfb-run -a -s '-screen 0 1366x768x24' /usr/bin/python3 - <<'PY'
          import sys, tkinter as tk
          sys.path.insert(0,'/tmp/ztm-v2/pkg/usr/lib/ztm')
          import ztm_gui
          root=tk.Tk()
          app=ztm_gui.ZTMApp(root)
          root.update_idletasks()
          assert app._font_zoom==1.65
          assert len(app._font_registry)>=8
          assert all(f.actual('size')>=round(key[1]*1.65) for key,f in app._font_registry.items())
          first=next(iter(app._font_registry.values()))
          before=first.actual('size')
          app.change_zoom(0.15)
          assert first.actual('size')>before
          app.change_zoom(-0.15)
          assert app.ui_zoom_status.get()=='UI 165%'
          print('GUI smoke pass',root.winfo_geometry(),'fonts',len(app._font_registry))
          assert root.winfo_width()<=1366 and root.winfo_height()<=768
          root.destroy()
          PY
      - name: Prepare signed-by-hash installer and one-README ZIP
        run: |
          set -euo pipefail
          python3 release/make_srp1v2_assets.py /tmp/ztm-v2/ZTM-SRP1V2_amd64.deb /tmp/ztm-v2/release
          bash -n /tmp/ztm-v2/release/install-ztm-srp1v2.sh
          cd /tmp/ztm-v2/release
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PY'
          import zipfile,pathlib
          z=zipfile.ZipFile('ZTM-SRP1V2_Linux_One_Command_README.zip')
          assert z.namelist()==['README.txt']
          s=z.read('README.txt').decode('utf-8')
          assert 'ZTM-SRP1V2' in s
          assert 'python3 -c ' in s
          assert '165%' in s
          assert 'Winning Configuration' in s
          print('single README ZIP verified:',len(s),'characters')
          PY
      - name: Guard stable release against unrelated changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ztm-v2/old-release /tmp/ztm-v2/new-release
          gh release download ZTM-SRP1V2 -R I2PS-Engineering/ZTM_Benchmark -p ZTM-SRP1V2_amd64.deb -D /tmp/ztm-v2/old-release
          echo 'ab4e8339a100957df62b2dc83849d9efe6dee3b1fc51fca41a18f7a7b5f18077  /tmp/ztm-v2/old-release/ZTM-SRP1V2_amd64.deb' | sha256sum -c -
          dpkg-deb -R /tmp/ztm-v2/old-release/ZTM-SRP1V2_amd64.deb /tmp/ztm-v2/old-release/root
          dpkg-deb -R /tmp/ztm-v2/ZTM-SRP1V2_amd64.deb /tmp/ztm-v2/new-release/root
          python3 - <<'PY'
          from pathlib import Path
          a=Path('/tmp/ztm-v2/old-release/root')
          b=Path('/tmp/ztm-v2/new-release/root')
          original={str(p.relative_to(a)):p.read_bytes() for p in a.rglob('*') if p.is_file()}
          updated={str(p.relative_to(b)):p.read_bytes() for p in b.rglob('*') if p.is_file()}
          assert original.keys()==updated.keys(), 'package file inventory changed'
          allowed={'usr/lib/ztm/ztm_engine.py','usr/lib/ztm/ztm_gui.py','usr/lib/ztm/ztm_mining.py'}
          actual=set()
          for path,data in original.items():
              wanted=data.replace(b'ZTM-RX1V2-L',b'ZTM-SRP1V2') if path in allowed else data
              assert updated[path]==wanted, 'unexpected modification: '+path
              if data!=updated[path]:actual.add(path)
          assert actual==allowed, 'unexpected changed files '+repr(actual)
          print('Rig-ID-only content audit PASSED')
          PY
      - name: Publish rig-ID-corrected SRP1V2 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R=/tmp/ztm-v2/release
          cd "$R"
          sha256sum -c SHA256SUMS.txt
          gh release view ZTM-SRP1V2 -R I2PS-Engineering/ZTM_Benchmark --json tagName >/dev/null
          gh release upload ZTM-SRP1V2 "$R/ZTM-SRP1V2_amd64.deb" "$R/install-ztm-srp1v2.sh" "$R/COPY_PASTE_COMMAND.txt" "$R/SHA256SUMS.txt" "$R/ZTM-SRP1V2_Linux_One_Command_README.zip" -R I2PS-Engineering/ZTM_Benchmark --clobber
          gh release edit ZTM-SRP1V2 -R I2PS-Engineering/ZTM_Benchmark --notes-file "$R/RELEASE_NOTES.md"
          gh release view ZTM-SRP1V2 -R I2PS-Engineering/ZTM_Benchmark --json tagName,assets
      - name: Update published rig ID and verified installation checksums
        run: |
          set -euo pipefail
          git config user.name 'I2PS Engineering Build'
          git config user.email 'engineering@i2psolutions.com'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          R=Path('/tmp/ztm-v2/release')
          installer_sha=hashlib.sha256((R/'install-ztm-srp1v2.sh').read_bytes()).hexdigest()
          pkg=R/'ZTM-SRP1V2_amd64.deb'
          pkg_sha=hashlib.sha256(pkg.read_bytes()).hexdigest()
          for name in ('README.md','docs/INSTALLATION.md'):
              p=Path(name)
              if not p.exists():continue
              before=p.read_text()
              after=before.replace('ZTM-RX1V2-L','ZTM-SRP1V2').replace('428cd6c872f81325c3b18de8c04a88d3f085daec5795f7cf4723a881734020dd',installer_sha).replace('ab4e8339a100957df62b2dc83849d9efe6dee3b1fc51fca41a18f7a7b5f18077',pkg_sha)
              if name=='README.md':after=after.replace('47,094 bytes',f'{pkg.stat().st_size:,} bytes')
              if before!=after:p.write_text(after)
          PY
          git add README.md docs/INSTALLATION.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(SRP1V2): update rig ID and installer checksums"
            git push origin HEAD:main
          fi
