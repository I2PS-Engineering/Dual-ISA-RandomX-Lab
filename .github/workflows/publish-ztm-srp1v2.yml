name: Publish ZTM-SRP1V2 Linux GUI Release

on:
  push:
    paths:
      - '.github/workflows/publish-ztm-srp1v2.yml'
      - 'release/patch_srp1v2.py'
      - 'release/autoscale_srp1v2.py'
      - 'release/make_srp1v2_assets.py'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V1.1 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ztm-v2
          gh release download ZTM-SRP1V1 -R I2PS-Engineering/ZTM_Benchmark -p ZTM-SRP1V1_amd64.deb -D /tmp/ztm-v2
          echo 'acd4bee9a502e39a673cbf39679710553fd83720cc261f5915166e8eb1c6dd56  /tmp/ztm-v2/ZTM-SRP1V1_amd64.deb' | sha256sum -c -
          dpkg-deb -R /tmp/ztm-v2/ZTM-SRP1V1_amd64.deb /tmp/ztm-v2/pkg
      - name: Apply controlled patch and verify invariants
        run: |
          set -euo pipefail
          ROOT=/tmp/ztm-v2/pkg
          find "$ROOT" -type f ! -path '*/DEBIAN/control' ! -path '*/usr/lib/ztm/ztm_gui.py' ! -path '*/usr/lib/ztm/ztm_engine.py' ! -path '*/usr/lib/ztm/ztm_mining.py' -print0 | sort -z | xargs -0 sha256sum > /tmp/ztm-v2/before
          python3 release/patch_srp1v2.py "$ROOT"
          python3 -m compileall -q "$ROOT/usr/lib/ztm"
          find "$ROOT/usr/lib/ztm" -type d -name __pycache__ -prune -exec rm -rf '{}' +
          find "$ROOT" -type f ! -path '*/DEBIAN/control' ! -path '*/usr/lib/ztm/ztm_gui.py' ! -path '*/usr/lib/ztm/ztm_engine.py' ! -path '*/usr/lib/ztm/ztm_mining.py' -print0 | sort -z | xargs -0 sha256sum > /tmp/ztm-v2/after
          cmp /tmp/ztm-v2/before /tmp/ztm-v2/after
          ENGINE="$ROOT/usr/lib/ztm/ztm_engine.py"
          python3 "$ENGINE" --plan --minutes 1440 >/tmp/ztm-v2/plan24
          if python3 "$ENGINE" --plan --minutes 60 >/tmp/ztm-v2/plan60 2>&1; then echo 'FAIL: 60-minute plan accepted'; exit 1; fi
          test "$(grep -Fo ZTM-SRP1V2 "$ENGINE" | wc -l)" -ge 4
          test "$(grep -Fo ZTM-SRP1V2 "$ROOT/usr/lib/ztm/ztm_mining.py" | wc -l)" -eq 2
          grep -Fq "WINNING CONFIGURATION" "$ENGINE"
          grep -Fq "show_winning_configuration" "$ROOT/usr/lib/ztm/ztm_gui.py"
          dpkg-deb --build --root-owner-group "$ROOT" /tmp/ztm-v2/ZTM-SRP1V2_amd64.deb
          test "$(dpkg-deb -f /tmp/ztm-v2/ZTM-SRP1V2_amd64.deb Version)" = '1.2.0~srp1v2'
          sha256sum /tmp/ztm-v2/ZTM-SRP1V2_amd64.deb
      - name: GUI auto-scaling smoke tests
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y xvfb python3-tk
          for resolution in 1024x768 1280x720 1366x768 1920x1080; do
            RES="$resolution" xvfb-run -a -s "-screen 0 ${resolution}x24" /usr/bin/python3 - <<'PY'
          import os, sys, tkinter as tk
          sys.path.insert(0, '/tmp/ztm-v2/pkg/usr/lib/ztm')
          import ztm_gui
          root=tk.Tk()
          app=ztm_gui.ZTMApp(root)
          root.update_idletasks()
          sw,sh=root.winfo_screenwidth(),root.winfo_screenheight()
          assert root.winfo_width() <= sw and root.winfo_height() <= sh
          expected=0.95 if sh<=800 else (1.10 if sh<=950 else (1.30 if sh<=1100 else 1.65))
          assert app._font_zoom == expected, (sw,sh,app._font_zoom)
          for control in (app.prepare_btn,app.benchmark_btn,app.terminal):
              assert control.winfo_ismapped(), (sw,sh,control)
              assert control.winfo_rootx()+control.winfo_width() <= root.winfo_rootx()+root.winfo_width()
              assert control.winfo_rooty()+control.winfo_height() <= root.winfo_rooty()+root.winfo_height()
          assert app.ui_zoom_status.get() == f"UI {round(expected*100)}%"
          app.change_zoom(0.15)
          assert app._font_zoom > expected
          app.change_zoom(-0.15)
          assert app._font_zoom == expected
          assert root.title().startswith("ZTM-SRP1V2")
          root.destroy()
          print("AUTO-SCALING PASS",sw,sh)
          PY
          done
      - name: Prepare signed-by-hash installer and one-README ZIP
        run: |
          set -euo pipefail
          python3 release/make_srp1v2_assets.py /tmp/ztm-v2/ZTM-SRP1V2_amd64.deb /tmp/ztm-v2/release
          bash -n /tmp/ztm-v2/release/install-ztm-srp1v2.sh
          cd /tmp/ztm-v2/release
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PY'
          import zipfile,pathlib
          z=zipfile.ZipFile('ZTM-SRP1V2_Linux_One_Command_README.zip')
          assert z.namelist()==['README.txt']
          s=z.read('README.txt').decode('utf-8')
          assert 'ZTM-SRP1V2' in s
          assert 'python3 -c ' in s
          assert 'adapts to the screen' in s
          assert 'Winning Configuration' in s
          print('single README ZIP verified:',len(s),'characters')
          PY
      - name: Guard stable release against unrelated changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ztm-v2/old-release /tmp/ztm-v2/new-release
          gh release download ZTM-SRP1V2 -R I2PS-Engineering/ZTM_Benchmark -p ZTM-SRP1V2_amd64.deb -D /tmp/ztm-v2/old-release
          echo 'ed9237993aac90d6bcf982e7b4955bdfe7abc4f1c6d5cc3cf5957c8b85a7758d  /tmp/ztm-v2/old-release/ZTM-SRP1V2_amd64.deb' | sha256sum -c -
          dpkg-deb -R /tmp/ztm-v2/old-release/ZTM-SRP1V2_amd64.deb /tmp/ztm-v2/old-release/root
          dpkg-deb -R /tmp/ztm-v2/ZTM-SRP1V2_amd64.deb /tmp/ztm-v2/new-release/root
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,sys
          a=Path('/tmp/ztm-v2/old-release/root')
          b=Path('/tmp/ztm-v2/new-release/root')
          old={str(p.relative_to(a)):p.read_bytes() for p in a.rglob('*') if p.is_file()}
          new={str(p.relative_to(b)):p.read_bytes() for p in b.rglob('*') if p.is_file()}
          assert old.keys()==new.keys(), 'stable package inventory changed'
          gui='usr/lib/ztm/ztm_gui.py'
          assert all(old[k]==new[k] for k in old if k!=gui), 'unapproved non-GUI modification'
          subprocess.run([sys.executable,'release/autoscale_srp1v2.py',str(a/gui)],check=True)
          assert (a/gui).read_bytes()==new[gui], 'GUI changed beyond authorized auto-scaling'
          assert new[gui]!=old[gui], 'no scaling update found'
          print('PASS: exactly one GUI file changed, exclusively through audited display patch')
          PY
      - name: Mirror verified stable installer and binary in repository
        run: |
          set -euo pipefail
          R=/tmp/ztm-v2/release
          mkdir -p dist
          cp "$R/ZTM-SRP1V2_amd64.deb" dist/ZTM-SRP1V2_amd64.deb
          cp "$R/install-ztm-srp1v2.sh" install-ztm-srp1v2.sh
          bash -n install-ztm-srp1v2.sh
          cmp -s "$R/ZTM-SRP1V2_amd64.deb" dist/ZTM-SRP1V2_amd64.deb
          cmp -s "$R/install-ztm-srp1v2.sh" install-ztm-srp1v2.sh
          git config user.name 'I2PS Engineering Build'
          git config user.email 'engineering@i2psolutions.com'
          git add dist/ZTM-SRP1V2_amd64.deb install-ztm-srp1v2.sh
          if ! git diff --cached --quiet; then
            git commit -m "release(SRP1V2): mirror verified package and installer in GitHub repository"
            git push origin HEAD:main
          fi
          # Verify both actual public raw downloads, rather than trusting metadata alone.
          curl -fLsS --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/ztm-retrieved-installer.sh 'https://raw.githubusercontent.com/I2PS-Engineering/ZTM_Benchmark/main/install-ztm-srp1v2.sh'
          curl -fLsS --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/ztm-retrieved-package.deb 'https://raw.githubusercontent.com/I2PS-Engineering/ZTM_Benchmark/main/dist/ZTM-SRP1V2_amd64.deb'
          cmp -s /tmp/ztm-retrieved-installer.sh "$R/install-ztm-srp1v2.sh"
          cmp -s /tmp/ztm-retrieved-package.deb "$R/ZTM-SRP1V2_amd64.deb"
          bash -n /tmp/ztm-retrieved-installer.sh
          dpkg-deb -f /tmp/ztm-retrieved-package.deb Version | grep -Fx '1.2.0~srp1v2'
          echo 'PASS: both install assets available over raw.githubusercontent.com and byte-identical'
      - name: Publish auto-scaled SRP1V2 stable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R=/tmp/ztm-v2/release
          cd "$R"
          sha256sum -c SHA256SUMS.txt
          gh release view ZTM-SRP1V2 -R I2PS-Engineering/ZTM_Benchmark --json tagName >/dev/null
          gh release upload ZTM-SRP1V2 "$R/ZTM-SRP1V2_amd64.deb" "$R/install-ztm-srp1v2.sh" "$R/COPY_PASTE_COMMAND.txt" "$R/SHA256SUMS.txt" "$R/ZTM-SRP1V2_Linux_One_Command_README.zip" -R I2PS-Engineering/ZTM_Benchmark --clobber
          gh release edit ZTM-SRP1V2 -R I2PS-Engineering/ZTM_Benchmark --notes-file "$R/RELEASE_NOTES.md"
          gh release view ZTM-SRP1V2 -R I2PS-Engineering/ZTM_Benchmark --json tagName,assets
      - name: Update verified installer and package checksums
        run: |
          set -euo pipefail
          git config user.name 'I2PS Engineering Build'
          git config user.email 'engineering@i2psolutions.com'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          R=Path('/tmp/ztm-v2/release')
          installer_sha=hashlib.sha256((R/'install-ztm-srp1v2.sh').read_bytes()).hexdigest()
          pkg=R/'ZTM-SRP1V2_amd64.deb'
          pkg_sha=hashlib.sha256(pkg.read_bytes()).hexdigest()
          for name in ('README.md','docs/INSTALLATION.md'):
              p=Path(name)
              if not p.exists():continue
              before=p.read_text()
              after=before.replace('06d3d7aa4a1553cd8649ddb0e4cef0888ed511ba18f6adf9e012a0f53356e891',installer_sha).replace('693f851b482b2727a1cfb1f608c4eff00604a492784c6b6c4308dcc537b15cca',installer_sha).replace('ed9237993aac90d6bcf982e7b4955bdfe7abc4f1c6d5cc3cf5957c8b85a7758d',pkg_sha).replace('https://github.com/I2PS-Engineering/ZTM_Benchmark/releases/download/ZTM-SRP1V2/install-ztm-srp1v2.sh','https://raw.githubusercontent.com/I2PS-Engineering/ZTM_Benchmark/main/install-ztm-srp1v2.sh').replace('165% text zoom','screen-adaptive text zoom')
              if name=='README.md':after=after.replace('47,086 bytes',f'{pkg.stat().st_size:,} bytes')
              if before!=after:p.write_text(after)
          PY
          git add README.md docs/INSTALLATION.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(SRP1V2): update rig ID and installer checksums"
            git push origin HEAD:main
          fi
